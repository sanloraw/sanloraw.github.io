<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanlo — Fotografía de calle</title>

<!-- Icono: la ese sobre sumi. Fondo oscuro para que se recorte igual de
     bien en pestañas claras y oscuras. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta name="theme-color" content="#3A3632">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================
   TOKENS
   ============================================ */
:root{
  --washi:#F4EFE6;
  --tatami:#EDE5D8;
  --luz:#FBF8F3;

  --sumi:#3A3632;
  --ceniza:#6B6259;
  --niebla:#9A8F82;

  --roble:#A67C52;
  --pino:#8C6239;
  --lino:#D9CFC0;
  --ambar:#C4A882;

  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Karla', -apple-system, BlinkMacSystemFont, sans-serif;

  --ma-xs:1.5rem;
  --ma-s:3rem;
  --ma-m:6rem;
  --ma-l:12rem;

  --lenta:1.2s cubic-bezier(.16,.84,.44,1);
  --media:.8s cubic-bezier(.16,.84,.44,1);
  --hover:.6s cubic-bezier(.33,1,.68,1);

  --barra:210px;
  --junta:10px;
  --junta-ancha:clamp(1rem,2.5vw,2rem);  /* la de la vista filtrada */
  --bastidor:1px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{
  scroll-behavior:smooth;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;   /* evita reajuste de texto en iOS al girar */
}

/* Sin resaltado azul al tocar; los estados propios ya dan feedback */
a,button{-webkit-tap-highlight-color:transparent}

body{
  background-color:var(--washi);
  color:var(--sumi);
  font-family:var(--sans);
  font-weight:300;
  font-size:clamp(.9rem,.85rem + .2vw,1rem);
  line-height:1.75;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(196,168,130,.05) 0%, transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(166,124,82,.04) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.045'/%3E%3C/svg%3E");
  background-attachment:fixed;
}

img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
/* El atributo hidden debe ganar a cualquier display explícito
   (los conceptos, haikus y archivo usan display:flex) */
[hidden]{display:none !important}
::selection{background:var(--ambar);color:var(--sumi)}
:focus-visible{outline:1px solid var(--roble);outline-offset:5px}

.sr-solo{
  position:absolute;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;border:0;
}

/* ============================================
   APERTURA
   ============================================ */
.apertura{
  min-height:100svh;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  text-align:center;position:relative;
  padding:var(--ma-m) clamp(1.5rem,5vw,5rem);
}
.marca{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(4rem,16vw,11rem);
  line-height:.9;letter-spacing:-.03em;
  color:var(--sumi);opacity:0;
  animation:revelar 2s cubic-bezier(.16,.84,.44,1) .4s forwards;
}
.marca em{
  font-style:italic;color:var(--roble);
  font-size:.34em;letter-spacing:0;vertical-align:super;
}
.apertura__linea{
  width:1px;height:0;background:var(--lino);
  margin-block:var(--ma-s);
  animation:crecer 1.6s cubic-bezier(.16,.84,.44,1) 1.2s forwards;
}
@keyframes crecer{to{height:70px}}
.apertura__meta{
  font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--niebla);opacity:0;
  animation:revelar 1.6s cubic-bezier(.16,.84,.44,1) 1.6s forwards;
}
.indicador{
  position:absolute;bottom:var(--ma-s);left:50%;
  transform:translateX(-50%);
  width:1px;height:56px;
  background:linear-gradient(to bottom, transparent, var(--lino));
  opacity:0;animation:revelar 2s ease 2.2s forwards;
}
.indicador::after{
  content:'';position:absolute;top:0;left:0;
  width:1px;height:18px;background:var(--roble);
  animation:descender 3.4s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes revelar{to{opacity:1}}
@keyframes descender{
  0%{transform:translateY(0);opacity:0}
  25%{opacity:1}75%{opacity:1}
  100%{transform:translateY(38px);opacity:0}
}

/* ============================================
   ESTRUCTURA
   ============================================ */
.taller{
  display:grid;
  grid-template-columns:var(--barra) 1fr;
  align-items:start;
}

/* --- BARRA LATERAL --- */
.barra{
  position:sticky;top:0;height:100svh;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:var(--ma-s) 0 var(--ma-s) clamp(1.5rem,3vw,2.5rem);
  border-right:1px solid var(--lino);
}
.barra__marca{
  font-family:var(--serif);
  font-size:1.35rem;font-weight:400;
  line-height:1.15;letter-spacing:.12em;
  color:var(--sumi);position:relative;
  /* reset de botón */
  background:none;border:none;padding:0;margin:0;
  text-align:left;cursor:pointer;
  transition:color var(--hover);
  display:block;
}
.barra__marca span{display:block}
.barra__marca::after{
  content:'';position:absolute;top:-6px;right:-10px;
  width:5px;height:5px;background:var(--sumi);
  transition:background var(--hover), transform var(--media);
}
/* El punto se tiñe de Roble al pasar el ratón: señal de que es pulsable */
.barra__marca:hover::after{background:var(--roble);transform:scale(1.3)}
/* --- FILTROS --- */
.filtros{
  display:flex;flex-direction:column;gap:.2rem;
  overflow-y:auto;
  flex:1 1 auto;
  min-height:0;
  padding-right:.6rem;
  margin-block:var(--ma-xs);
  scrollbar-width:thin;
  scrollbar-color:var(--lino) transparent;
}
.filtros::-webkit-scrollbar{width:3px}
.filtros::-webkit-scrollbar-thumb{background:var(--lino)}

.grupo{border-bottom:1px solid var(--lino)}
.grupo:first-child{border-top:1px solid var(--lino)}

/* Cabecera de categoría: mismo trato que la navegación anterior —
   cuadrado en Sumi a la izquierda y subrayado en Roble al pasar */
.grupo__boton{
  width:100%;
  display:flex;align-items:center;
  gap:.8rem;
  padding:.9rem 0 .9rem 1.1rem;
  background:none;border:none;cursor:pointer;
  font-family:var(--sans);
  font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ceniza);
  text-align:left;
  position:relative;
  transition:color var(--hover);
}
.grupo__boton::before{
  content:'';position:absolute;left:0;top:50%;
  width:5px;height:5px;background:var(--sumi);
  transform:translateY(-50%) scale(0);
  transition:transform var(--media);
}
.grupo__boton::after{
  content:'';position:absolute;left:1.1rem;bottom:.5rem;
  width:calc(100% - 1.1rem);height:1px;background:var(--roble);
  transform:scaleX(0);transform-origin:right;
  transition:transform var(--media);
}
.grupo__boton:hover{color:var(--sumi)}
.grupo__boton:hover::after{transform:scaleX(1);transform-origin:left}
.grupo__boton[aria-expanded="true"]{color:var(--sumi)}
.grupo__boton[aria-expanded="true"]::before{transform:translateY(-50%) scale(1)}

/* Signo: una línea que se cruza al abrir */
.grupo__signo{
  position:relative;
  width:9px;height:9px;
  flex:0 0 auto;
  margin-left:auto;
}
.grupo__signo::before,.grupo__signo::after{
  content:'';position:absolute;
  background:var(--niebla);
  top:50%;left:0;
  width:100%;height:1px;
  transition:transform var(--media), background var(--hover);
}
.grupo__signo::after{transform:rotate(90deg)}
.grupo__boton:hover .grupo__signo::before,
.grupo__boton:hover .grupo__signo::after{background:var(--sumi)}
.grupo__boton[aria-expanded="true"] .grupo__signo::after{transform:rotate(0deg)}
.grupo__boton[aria-expanded="true"] .grupo__signo::before{background:var(--sumi)}

/* Panel desplegable */
.grupo__panel{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows var(--media);
}
.grupo__boton[aria-expanded="true"] + .grupo__panel{grid-template-rows:1fr}
.grupo__lista{
  overflow:hidden;
  display:flex;flex-direction:column;
}
.grupo__interior{
  display:flex;flex-direction:column;gap:.1rem;
  padding-bottom:.9rem;
  padding-left:1.1rem;
}

/* Opción: mismo lenguaje, cuadrado más pequeño */
.opcion{
  display:flex;align-items:center;
  gap:.8rem;
  padding:.4rem 0 .4rem 1.1rem;
  background:none;border:none;cursor:pointer;
  font-family:var(--sans);
  font-size:.68rem;letter-spacing:.1em;
  color:var(--niebla);
  text-align:left;
  position:relative;
  transition:color var(--hover);
}
.opcion::before{
  content:'';position:absolute;left:0;top:50%;
  width:4px;height:4px;background:var(--sumi);
  transform:translateY(-50%) scale(0);
  transition:transform var(--media);
}
.opcion::after{
  content:'';position:absolute;left:1.1rem;bottom:.15rem;
  width:calc(100% - 1.1rem);height:1px;background:var(--roble);
  transform:scaleX(0);transform-origin:right;
  transition:transform var(--media);
}
.opcion:hover{color:var(--ceniza)}
.opcion:hover::after{transform:scaleX(1);transform-origin:left}
.opcion[aria-pressed="true"]{color:var(--sumi)}
.opcion[aria-pressed="true"]::before{transform:translateY(-50%) scale(1)}

/* Un escalón más adentro: las zonas cuelgan de su ciudad. Se sangran y
   se dibuja el codo de un árbol para que se lea la dependencia sin tener
   que explicarla. Sólo asoman con su ciudad marcada. */
.opcion--zona{
  margin-left:1.5rem;
  font-size:.63rem;
  color:var(--lino);
}
.opcion--zona::before{left:0}
.opcion--zona::after{left:1.1rem;width:calc(100% - 1.1rem)}
/* el codo: una vertical corta y su giro hacia el rótulo */
.opcion--zona .opcion__codo{
  position:absolute;left:-.75rem;top:0;
  width:.55rem;height:50%;
  border-left:1px solid var(--lino);
  border-bottom:1px solid var(--lino);
  pointer-events:none;
}
.opcion--zona:hover{color:var(--niebla)}
.opcion--zona[aria-pressed="true"]{color:var(--sumi)}

.opcion__cuenta{
  margin-left:auto;
  font-size:.58rem;
  color:var(--lino);
  font-variant-numeric:tabular-nums;
  transition:color var(--hover);
}
.opcion[aria-pressed="true"] .opcion__cuenta{color:var(--niebla)}

/* Botón de limpiar */
.filtros__limpiar{
  align-self:flex-start;
  margin-top:.9rem;
  padding:.3rem 0;
  background:none;border:none;cursor:pointer;
  font-family:var(--sans);
  font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--roble);
  position:relative;
  opacity:0;pointer-events:none;
  transition:opacity var(--media), color var(--hover);
}
.filtros__limpiar.activo{opacity:1;pointer-events:auto}
.filtros__limpiar::after{
  content:'';position:absolute;left:0;bottom:0;
  width:100%;height:1px;background:var(--roble);
  transform:scaleX(0);transform-origin:right;
  transition:transform var(--media);
}
.filtros__limpiar:hover::after{transform:scaleX(1);transform-origin:left}

/* Enlace de contacto, al pie de los filtros */
.barra__contacto{
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ceniza);position:relative;width:fit-content;
  transition:color var(--hover);
}
.barra__contacto::after{
  content:'';position:absolute;left:0;bottom:-4px;
  width:100%;height:1px;background:var(--roble);
  transform:scaleX(0);transform-origin:right;
  transition:transform var(--media);
}
.barra__contacto:hover{color:var(--sumi)}
.barra__contacto:hover::after{transform:scaleX(1);transform-origin:left}

.barra__pie{display:flex;flex-direction:column;gap:1.2rem}
.barra__social{display:flex;gap:.9rem}
.barra__social a{
  font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--niebla);transition:color var(--hover);
}
.barra__social a:hover{color:var(--sumi)}
.barra__copy{font-size:.6rem;letter-spacing:.1em;color:var(--niebla)}

/* --- CUERPO --- */
.cuerpo{
  padding:var(--ma-s) clamp(1.5rem,4vw,3.5rem) var(--ma-m);
  min-width:0;
}

.cabecera{
  display:flex;align-items:baseline;justify-content:flex-end;
  gap:var(--ma-s);flex-wrap:wrap;margin-bottom:var(--ma-xs);
}
.cabecera__meta{
  display:flex;align-items:center;gap:1.2rem;
  font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--niebla);
}

/* En modo filtrado la cabecera se retira: solo fotos.
   Colapsa su alto con una transición para que la salida sea suave. */
.cuerpo.filtrando .cabecera{
  opacity:0;
  max-height:0;
  margin:0;
  overflow:hidden;
  pointer-events:none;
  transition:opacity var(--media), max-height var(--media), margin var(--media);
}
.cabecera{
  max-height:8rem;
  transition:opacity var(--media), max-height var(--media), margin var(--media);
}

/* ============================================
   MOSAICO EN COLUMNAS
   Cada columna apila piezas de altura libre. Las fotos se
   muestran enteras — su altura la marca su propia proporción,
   no la retícula. Las columnas mantienen el ancho regular,
   así el conjunto sigue leyéndose como un panel shoji.
   ============================================ */
.mosaico{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--junta);
  align-items:stretch;      /* las columnas igualan altura */
  padding:var(--junta);
  border:var(--bastidor) solid var(--lino);
  position:relative;
}
.mosaico::before,.mosaico::after{
  content:'';position:absolute;
  width:14px;height:14px;
  border-color:var(--sumi);border-style:solid;
}
.mosaico::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.mosaico::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}

.columna{
  display:flex;
  flex-direction:column;
  gap:var(--junta);
  min-width:0;
}
/* Cuando una columna termina antes que las demás, el separador que la
   cierra absorbe el hueco. Solo puede estirarse un separador —nunca una
   fotografía, que se deformaría— y con tope, para que no se desmande
   como ocurría cuando el sobrante iba a parar a la última pieza fuese
   cual fuese. */
.columna > .concepto:last-child,
.columna > .haiku:last-child{
  flex:1 1 auto;
  max-height:480px;   /* del orden de la foto más alta: rellena sin dominar */
}

/* --- MODO FILTRADO ---
   Al elegir una opción, la vista se limpia por completo: fuera cabecera,
   conceptos, haikus y archivo (exclusivos de la portada). Las fotos que
   cumplen el filtro se muestran en dos columnas, grandes y a tamaño completo.
   Cada una abre el visor a pantalla completa al pulsarla.

   Aquí no vale una retícula: en ella las celdas de una misma fila igualan
   altura, así que una vertical a la derecha abría un socavón bajo la
   horizontal de la izquierda. Con columnas de verdad cada foto se apoya
   en la de arriba y el hueco desaparece; el aire entre ellas se mantiene. */
.mosaico.filtrando{
  display:block;
  column-count:2;
  column-gap:var(--junta-ancha);
  border:none;
  padding:0;
}
.mosaico.filtrando::before,
.mosaico.filtrando::after{display:none}
.mosaico.filtrando .columna{
  display:contents;   /* las fotos pasan al flujo de las columnas */
}
/* Ninguna foto se parte por la mitad al cambiar de columna, y la junta
   entre unas y otras la pone cada tesela por debajo */
.mosaico.filtrando .tesela{
  break-inside:avoid;
  margin:0 0 var(--junta-ancha);
}
.mosaico.filtrando .tesela--foto{cursor:zoom-in}
.mosaico.filtrando .tesela--foto img{height:auto}
/* Rótulo siempre visible en la vista filtrada */
.mosaico.filtrando .tesela__rotulo{opacity:1;transform:none}

.tesela{position:relative;overflow:hidden}

/* --- FOTOGRAFÍAS: enteras, sin recorte --- */
.tesela--foto{background:var(--tatami);cursor:zoom-in}
.tesela--foto img{
  width:100%;
  height:auto;          /* la altura la manda la foto */
  display:block;
  transition:transform 2.6s cubic-bezier(.16,.84,.44,1);
}
.tesela--foto:hover img{transform:scale(1.03)}

/* Las fotografías se muestran tal cual: ningún filtro las retoca */

.tesela--foto::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(140deg, rgba(251,248,243,.22) 0%, transparent 55%);
  opacity:0;pointer-events:none;transition:opacity var(--lenta);
}
.tesela--foto:hover::after{opacity:1}

.tesela__rotulo{
  position:absolute;left:1rem;bottom:.9rem;z-index:2;
  font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--luz);opacity:0;transform:translateY(8px);
  transition:opacity var(--media), transform var(--media);
  text-shadow:0 1px 12px rgba(58,54,50,.55);
}
.tesela--foto:hover .tesela__rotulo{opacity:1;transform:none}

/* --- CONCEPTOS: formato compacto, como la primera versión de Ma
   Kanji grande y glosa debajo. Sin verso, sin marca de agua. --- */
.concepto{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:center;
  text-align:right;
  gap:.45rem;
  padding:var(--ma-xs);
  min-height:110px;
}
.concepto__kanji{
  font-family:var(--serif);
  font-style:italic;
  font-size:1.5rem;
  line-height:1;
}
.concepto__glosa{
  font-size:.58rem;
  letter-spacing:.22em;
  text-transform:uppercase;
}

.concepto--pino{background:var(--pino)}
.concepto--pino .concepto__kanji{color:var(--washi)}
.concepto--pino .concepto__glosa{color:var(--ambar)}

.concepto--sumi{background:var(--sumi);position:relative;overflow:hidden}
.concepto--sumi .concepto__kanji{color:var(--washi);position:relative;z-index:1}
.concepto--sumi .concepto__glosa{color:var(--ambar);position:relative;z-index:1}
/* Retícula shoji muy tenue calada sobre el oscuro */
.concepto--sumi::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(to right, rgba(244,239,230,.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(244,239,230,.07) 1px, transparent 1px);
  background-size:33.333% 25%;
  pointer-events:none;
}

.concepto--papel{
  background:var(--luz);
  border:var(--bastidor) solid var(--lino);
  position:relative;
}
.concepto--papel .concepto__kanji{color:var(--sumi)}
.concepto--papel .concepto__glosa{color:var(--niebla)}
.concepto--papel::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 75% 20%, rgba(196,168,130,.2) 0%, transparent 60%);
  pointer-events:none;
}

/* Alineación a la izquierda para alternar el ritmo */
.concepto--izq{align-items:flex-start;text-align:left}

/* --- HAIKUS: tesela propia, sobre washi --- */
.haiku{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:.9rem;
  padding:var(--ma-xs) 1rem;
  min-height:110px;
}
.haiku p{
  font-family:var(--serif);
  font-style:italic;
  font-size:clamp(.88rem,.82rem + .3vw,1.05rem);
  line-height:1.5;
  color:var(--sumi);
}
.haiku p span{display:block}
.haiku--der{text-align:right;align-items:flex-end}

/* ============================================
   VISOR — pantalla completa, una foto, con flechas
   ============================================ */
/* Dos columnas de altura completa: la foto a la izquierda y su ficha a
   la derecha, como una segunda página. */
.visor{
  position:fixed;inset:0;z-index:200;
  display:grid;
  grid-template-columns:1fr clamp(260px,22vw,340px);
  background:rgba(244,239,230,.94);
  backdrop-filter:blur(30px) saturate(1.05);
  -webkit-backdrop-filter:blur(30px) saturate(1.05);
  opacity:0;visibility:hidden;
  transition:opacity var(--media), visibility var(--media);
}
.visor.abierto{opacity:1;visibility:visible}

.visor__principal{
  display:flex;flex-direction:column;
  min-width:0;min-height:0;
  position:relative;   /* ancla del aspa, que ya no ocupa fila */
}

/* Barra superior: solo el cierre. El contador se fue a la ficha.
   Flota sobre la escena en vez de ocupar una fila propia. Una fila
   entera para un aspa de 30px salía cara: a las verticales les sobra
   anchura y lo que les falta es alto, así que ese hueco es justo el
   que necesitaban. El aspa queda por fuera de la foto de todos modos,
   porque la escena reserva su propio margen lateral. */
.visor__barra{
  position:absolute;top:0;right:0;z-index:3;
  display:flex;align-items:center;justify-content:flex-end;
  padding:clamp(1.2rem,3vw,2rem) clamp(1.5rem,4vw,3rem);
}
.visor__cuenta{
  font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ceniza);font-variant-numeric:tabular-nums;
}
.visor__cerrar{
  width:30px;height:30px;
  background:none;border:none;cursor:pointer;
  position:relative;flex:0 0 auto;
}
.visor__cerrar::before,.visor__cerrar::after{
  content:'';position:absolute;top:50%;left:0;
  width:100%;height:1px;background:var(--sumi);
  transition:background var(--hover);
}
.visor__cerrar::before{transform:rotate(45deg)}
.visor__cerrar::after{transform:rotate(-45deg)}
.visor__cerrar:hover::before,.visor__cerrar:hover::after{background:var(--roble)}

/* Escenario central.
   El margen de arriba y el de abajo se miden en vh, no en vw: es el alto
   lo que aprieta a la fotografía, y así el aire crece con la pantalla en
   la dirección que importa. El lateral sigue en vw, que es lo que aparta
   las flechas. */
.visor__escena{
  flex:1 1 auto;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(1.25rem,3vh,2.5rem) clamp(4rem,7vw,6rem);
  min-height:0;min-width:0;
  position:relative;   /* ancla de las flechas */
}

.visor__figura{
  display:flex;align-items:center;justify-content:center;
  /* alto definido: sin él, el max-height en porcentaje de la imagen no
     tiene contra qué resolverse y la foto se sale en pantallas bajas */
  width:100%;height:100%;
  min-width:0;min-height:0;
}
.visor__figura img{
  max-width:100%;
  max-height:100%;
  width:auto;height:auto;
  object-fit:contain;
  opacity:0;
  transition:opacity var(--media);
}
.visor__figura img.cargada{opacity:1}

/* --- FICHA LATERAL ---
   Superficie propia, no texto flotando: fondo sólido sobre el velado del
   visor, de arriba abajo de la pantalla. */
/* Como una cartela: el contador arriba y el bloque de datos al pie. El
   hueco queda en medio, sujeto por los dos extremos, en vez de sobrar
   al final. */
.ficha{
  background:var(--luz);
  border-left:1px solid var(--lino);
  padding:clamp(1.4rem,3vw,2rem) clamp(1.4rem,2.4vw,2.2rem);
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow-y:auto;
  min-height:0;
  scrollbar-width:thin;
  scrollbar-color:var(--lino) transparent;
}
/* el margen automático empuja todo lo demás al fondo */
.ficha .visor__cuenta{margin-bottom:auto}

.ficha__titulo{
  font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(1.7rem,1.3rem + 1.2vw,2.3rem);
  line-height:1;letter-spacing:-.01em;
  color:var(--sumi);
  position:relative;padding-bottom:.75rem;
  margin-bottom:1.3rem;
  flex:0 0 auto;
}
.ficha__titulo::after{
  content:'';position:absolute;left:0;bottom:0;
  width:34px;height:1px;background:var(--roble);
}
.ficha__titulo:empty{display:none}

/* Los ajustes del disparo, cantados juntos como se dicen de viva voz.
   Misma letra y mismo cuerpo que los valores de las filas: es un dato
   más, no un titular, y en serif se despegaba del resto de la cartela. */
.ficha__exposicion{
  font-size:.82rem;
  line-height:1.5;letter-spacing:.02em;
  color:var(--sumi);
  font-variant-numeric:tabular-nums;
}
.ficha__exposicion:empty{display:none}

/* La focal, un escalón por debajo: acompaña a la exposición sin
   disputarle el renglón. Siempre en equivalente de 35 mm, que es lo
   único comparable entre cámaras de sensores distintos. */
.ficha__focal{
  font-size:.72rem;letter-spacing:.14em;
  color:var(--niebla);
  margin-top:.3rem;
  font-variant-numeric:tabular-nums;
}
.ficha__focal:empty{display:none}
.ficha__exposicion:not(:empty) ~ .ficha__lista,
.ficha__focal:not(:empty) ~ .ficha__lista{margin-top:1.1rem}

/* Rótulo y valor en el mismo renglón: es lo que más alto ahorra */
.ficha__lista{display:flex;flex-direction:column}
.ficha__fila{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:1rem;
  padding:.7rem 0;
  border-top:1px solid var(--tatami);
}
.ficha__fila:last-child{border-bottom:1px solid var(--tatami)}
.ficha__fila dt{
  font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--niebla);
  flex:0 0 auto;
}
.ficha__fila dd{
  font-size:.82rem;letter-spacing:.02em;
  color:var(--sumi);
  text-align:right;
  min-width:0;
}

/* Flechas: ancladas a los bordes de la escena, en la misma posición
   siempre, independientes del tamaño de cada foto */
.visor__flecha{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:2;
  width:clamp(40px,5vw,54px);
  height:clamp(40px,5vw,54px);
  background:none;
  border:1px solid var(--lino);
  border-radius:50%;
  cursor:pointer;
  transition:border-color var(--hover), background var(--hover);
}
.visor__flecha--prev{left:clamp(1rem,3vw,2.5rem)}
.visor__flecha--next{right:clamp(1rem,3vw,2.5rem)}
.visor__flecha:hover{border-color:var(--roble);background:rgba(166,124,82,.06)}
.visor__flecha::before{
  content:'';position:absolute;top:50%;left:50%;
  width:9px;height:9px;
  border-top:1px solid var(--sumi);
  border-right:1px solid var(--sumi);
  transition:border-color var(--hover);
}
.visor__flecha--prev::before{transform:translate(-30%,-50%) rotate(-135deg)}
.visor__flecha--next::before{transform:translate(-70%,-50%) rotate(45deg)}
.visor__flecha:hover::before{border-color:var(--roble)}
.visor__flecha:disabled{opacity:.25;cursor:default}
.visor__flecha:disabled:hover{border-color:var(--lino);background:none}
.visor__flecha:disabled:hover::before{border-color:var(--sumi)}

/* Sin sitio para dos columnas: la ficha pasa debajo de la foto, en una
   banda propia. Ahí no hay hueco que repartir, así que el contador se
   pone en línea con el título y los datos se reparten a lo ancho. */
@media (max-width:880px){
  .visor{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,1fr) auto;
  }
  .visor__escena{padding-bottom:clamp(1rem,3vw,2rem)}
  .ficha{
    border-left:none;
    border-top:1px solid var(--lino);
    justify-content:flex-start;
    overflow:visible;
    padding:clamp(1.1rem,3.5vw,1.6rem) clamp(1.5rem,5vw,2rem) clamp(1.3rem,4vw,1.8rem);
  }
  .ficha .visor__cuenta{margin-bottom:.5rem}
  .ficha__titulo{
    font-size:clamp(1.6rem,1.35rem + 1vw,2rem);
    padding-bottom:.7rem;
    margin-bottom:1rem;
  }
  .ficha__lista{
    flex-direction:row;flex-wrap:wrap;
    gap:0 clamp(1.5rem,6vw,3rem);
    border-top:1px solid var(--tatami);
    padding-top:.9rem;
  }
  .ficha__fila{
    border:none;padding:0;
    gap:.5rem;
    flex:0 0 auto;
  }
  .ficha__fila:last-child{border-bottom:none}
}

/* Pantalla baja y apaisada (el móvil girado): la ficha se aprieta para
   no dejar a la fotografía sin sitio */
@media (max-height:520px) and (max-width:880px){
  .ficha{padding-block:.8rem}
  .ficha .visor__cuenta{margin-bottom:.3rem}
  .ficha__titulo{
    font-size:1.4rem;
    padding-bottom:.45rem;
    margin-bottom:.7rem;
  }
  .ficha__lista{padding-top:.6rem}
  .visor__barra{padding-block:.7rem}
}

@media (max-width:640px){
  .visor__escena{
    padding-inline:0;
  }
  .visor__flecha{
    width:46px;height:46px;
    background:rgba(244,239,230,.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .visor__flecha--prev{left:.6rem}
  .visor__flecha--next{right:.6rem}
  /* Cerrar más grande y fácil de acertar. Aquí la escena no tiene margen
     lateral, así que el aspa puede quedar sobre la propia fotografía:
     lleva la misma pastilla translúcida que las flechas para leerse
     igual de bien sea cual sea lo que tenga debajo. */
  .visor__cerrar{
    width:40px;height:40px;
    border-radius:50%;
    background:rgba(244,239,230,.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  /* las aspas se dibujan con ::before/::after al 100% del botón: con la
     pastilla detrás hay que encogerlas para que no toquen el borde */
  .visor__cerrar::before,.visor__cerrar::after{
    left:50%;width:16px;margin-left:-8px;
  }
  .visor__barra{padding:1.2rem 1.4rem}
  /* La imagen no debe capturar el gesto de deslizar */
  .visor__figura img{touch-action:pan-y}
}

@media (prefers-reduced-motion:reduce){
  .visor__figura img{transition:none;opacity:1}
}

/* ============================================
   CIERRE
   ============================================ */
.cierre{
  margin-top:var(--ma-l);
  padding-top:var(--ma-m);
  border-top:1px solid var(--lino);
  text-align:center;
}
.cierre__intro{
  font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--niebla);margin-bottom:var(--ma-xs);
}
/* Botón de contacto: la dirección no se escribe, va dentro del mailto.
   Conserva el peso tipográfico que tenía el correo en grande, con un
   marco que lo hace legible como botón. */
.cierre__boton{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(1.3rem,.9rem + 2.2vw,2.6rem);line-height:1.1;
  display:inline-block;position:relative;
  padding:.5em 1.2em;
  border:1px solid var(--lino);
  color:var(--sumi);
  transition:color var(--hover), border-color var(--hover);
}
.cierre__boton::after{
  content:'';position:absolute;left:0;bottom:0;
  width:100%;height:1px;background:var(--roble);
  transform:scaleX(0);transform-origin:right;
  transition:transform var(--media);
}
.cierre__boton:hover{color:var(--pino);border-color:var(--ambar)}
.cierre__boton:hover::after{transform:scaleX(1);transform-origin:left}

/* ============================================
   REVELADO
   ============================================ */
.al-entrar{
  opacity:0;transform:translateY(20px);
  transition:opacity 1.3s cubic-bezier(.16,.84,.44,1), transform 1.3s cubic-bezier(.16,.84,.44,1);
}
.al-entrar.visible{opacity:1;transform:none}

/* ============================================
   TABLETA — dos columnas
   ============================================ */
@media (max-width:1080px){
  :root{--barra:170px}
  .mosaico{grid-template-columns:repeat(2,1fr)}
  /* La tercera columna se reparte: sus piezas pasan a las otras dos */
  .columna--c{display:contents}
  .columna--c > *{grid-column:1 / -1}
}

/* ============================================
   MÓVIL — una columna
   ============================================ */
@media (max-width:760px){
  :root{--junta:8px}
  .taller{grid-template-columns:1fr}

  .barra{
    position:static;height:auto;
    flex-direction:column;align-items:stretch;
    gap:1rem;
    padding:var(--ma-xs) clamp(1.5rem,5vw,2rem);
    border-right:none;border-bottom:1px solid var(--lino);
  }
  .barra__cabecera{
    display:flex;align-items:center;justify-content:space-between;gap:1.2rem;
  }
  .barra__marca{display:flex;gap:.3em;font-size:1.1rem}
  .barra__marca::after{top:-4px;right:-8px;width:4px;height:4px}
  .filtros{
    overflow:visible;max-height:none;
    margin-block:0;padding-right:0;
  }
  /* El pie de la barra sí se ve en móvil: es donde está Instagram, y el
     móvil es justo desde donde más se busca. En una fila, para no comerse
     el alto de la portada. */
  .barra__pie{
    flex-direction:row;align-items:center;justify-content:space-between;
    gap:1rem;
  }
  .barra__contacto{align-self:flex-start}

  .cuerpo{padding:var(--ma-s) clamp(1.5rem,5vw,2rem) var(--ma-m)}
  .cabecera__meta{font-size:.62rem;gap:.8rem}

  .mosaico{grid-template-columns:1fr}
  .columna--c{display:flex}
  .columna--c > *{grid-column:auto}
  /* En móvil, filtrado a una sola foto por fila */
  .mosaico.filtrando{column-count:1}

  .concepto{min-height:120px}
  .haiku{min-height:auto;padding-block:var(--ma-s)}
  .tesela__rotulo{opacity:1;transform:none}

  /* Zonas de toque más amplias en móvil (mín. cómodo ~44px) */
  .barra__social a{
    display:inline-flex;align-items:center;
    min-height:44px;padding-inline:.8rem;
    margin-left:-.8rem;   /* compensa el relleno para no descuadrar el pie */
  }
  .grupo__boton{padding-block:1.1rem}
  .opcion{padding-block:.7rem}
  .barra__contacto{padding-block:.6rem}
  .filtros__limpiar{padding-block:.7rem}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
  .al-entrar{opacity:1;transform:none}
  .marca,.apertura__meta,.indicador{opacity:1}
  .apertura__linea{height:70px}
}
</style>
</head>
<body>

<!-- APERTURA -->
<header class="apertura">
  <h1 class="marca">Sanlo<em>.raw</em></h1>
  <div class="apertura__linea" aria-hidden="true"></div>
  <p class="apertura__meta">Fotografía de calle · Madrid</p>

</header>

<div class="taller">

  <!-- BARRA LATERAL -->
  <aside class="barra">
    <div class="barra__cabecera">
      <button class="barra__marca" type="button" id="volver-inicio" aria-label="Sanlo — volver a la portada">

      </button>
    </div>

    <div class="filtros">

      <!-- FORMATO — excluyente -->
      <div class="grupo">
        <button class="grupo__boton" aria-expanded="false" aria-controls="p-formato">
          Formato
          <span class="grupo__signo" aria-hidden="true"></span>
        </button>
        <div class="grupo__panel" id="p-formato">
          <div class="grupo__lista">
            <div class="grupo__interior" role="group" aria-label="Formato">
              <button class="opcion" data-eje="formato" data-valor="digital" aria-pressed="false">
                Digital
                <span class="opcion__cuenta">4</span>
              </button>
              <button class="opcion" data-eje="formato" data-valor="analogico" aria-pressed="false">
                Analógico
                <span class="opcion__cuenta">3</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- CIUDAD — acumulable -->
      <div class="grupo">
        <button class="grupo__boton" aria-expanded="false" aria-controls="p-ciudad">
          Ciudad
          <span class="grupo__signo" aria-hidden="true"></span>
        </button>
        <div class="grupo__panel" id="p-ciudad">
          <div class="grupo__lista">
            <div class="grupo__interior" role="group" aria-label="Ciudad">
              <!-- Lo de aquí dentro lo escribe el taller a partir de
                   filtros.json. No lo edites a mano: se sobreescribe.
                   data-valor va tal cual el campo "city", con sus tildes,
                   y bajo cada ciudad van sus zonas sangradas, que sólo
                   asoman cuando esa ciudad está marcada. -->
              <!-- ciudades:inicio -->
              <button class="opcion" data-eje="ciudad" data-valor="Castellón" aria-pressed="false">
                Castellón
                <span class="opcion__cuenta">0</span>
              </button>
              <button class="opcion opcion--zona" data-eje="zona" data-valor="Fanzara" data-ciudad="Castellón" aria-pressed="false" hidden>
                <span class="opcion__codo" aria-hidden="true"></span>
                Fanzara
                <span class="opcion__cuenta">0</span>
              </button>
              <button class="opcion opcion--zona" data-eje="zona" data-valor="El Tormo" data-ciudad="Castellón" aria-pressed="false" hidden>
                <span class="opcion__codo" aria-hidden="true"></span>
                El Tormo
                <span class="opcion__cuenta">0</span>
              </button>
              <button class="opcion" data-eje="ciudad" data-valor="Madrid" aria-pressed="false">
                Madrid
                <span class="opcion__cuenta">0</span>
              </button>
              <button class="opcion opcion--zona" data-eje="zona" data-valor="Barajas" data-ciudad="Madrid" aria-pressed="false" hidden>
                <span class="opcion__codo" aria-hidden="true"></span>
                Barajas
                <span class="opcion__cuenta">0</span>
              </button>
              <button class="opcion opcion--zona" data-eje="zona" data-valor="Vallekas" data-ciudad="Madrid" aria-pressed="false" hidden>
                <span class="opcion__codo" aria-hidden="true"></span>
                Vallekas
                <span class="opcion__cuenta">0</span>
              </button>
              <button class="opcion opcion--zona" data-eje="zona" data-valor="Garganta de los Montes" data-ciudad="Madrid" aria-pressed="false" hidden>
                <span class="opcion__codo" aria-hidden="true"></span>
                Garganta de los Montes
                <span class="opcion__cuenta">0</span>
              </button>
              <button class="opcion" data-eje="ciudad" data-valor="Valencia" aria-pressed="false">
                Valencia
                <span class="opcion__cuenta">0</span>
              </button>
              <button class="opcion" data-eje="ciudad" data-valor="Jaén" aria-pressed="false">
                Jaén
                <span class="opcion__cuenta">0</span>

                <span class="opcion__codo" aria-hidden="true"></span>

              <button class="opcion opcion--zona" data-eje="zona" data-valor="Baeza" data-ciudad="Jaén" aria-pressed="false" hidden>

              <!-- Lo de aquí dentro lo escribe el taller a partir de

    <div class="barra__pie">

        <a href="https://www.instagram.com/sanlo.raw/"
           target="_blank" rel="noopener noreferrer"

      </div>

    </div>
  </aside>

  <!-- CUERPO -->
  <main class="cuerpo">

    <div class="cabecera">
      <div class="cabecera__meta">
        <span data-cuenta>28 fotografías</span>
      </div>
    </div>

    <p id="aviso-filtros" class="sr-solo" aria-live="polite" role="status"></p>

    <!-- MOSAICO -->
    <section class="mosaico" id="mosaico" aria-label="Fotografías">
      <div class="columna columna--a"></div>
      <div class="columna columna--b"></div>
      <div class="columna columna--c"></div>
    </section>

    <!-- CIERRE -->
    <footer class="cierre" id="contacto">
      <p class="cierre__intro al-entrar">Para encargos, copias o simplemente hablar</p>
      <a href="mailto:danielsanlorenzo9953@gmail.com" class="cierre__boton al-entrar">Contacto</a>
    </footer>

  </main>
</div>

<!-- VISOR -->
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Visor de fotografías" hidden>
  <div class="visor__principal">
    <div class="visor__barra">
      <button class="visor__cerrar" type="button" aria-label="Cerrar visor"></button>
    </div>
    <div class="visor__escena">
      <button class="visor__flecha visor__flecha--prev" type="button" aria-label="Anterior"></button>
      <figure class="visor__figura">
        <img id="visor-img" src="" alt="">
      </figure>
      <button class="visor__flecha visor__flecha--next" type="button" aria-label="Siguiente"></button>
    </div>
  </div>

  <aside class="ficha" aria-label="Datos de la fotografía">
    <span class="visor__cuenta" id="visor-cuenta"></span>
    <h2 class="ficha__titulo" id="visor-lugar"></h2>
    <p class="ficha__exposicion" id="visor-exposicion"></p>
    <p class="ficha__focal" id="visor-focal"></p>
    <dl class="ficha__lista" id="visor-lista"></dl>
  </aside>
</div>

<script>
(async function(){
  'use strict';

  /* ══════════════════════════════════════════════════════════════════
     Las fotos viven en filtros.json y los separadores (conceptos y
     haikus) en separadores.json, ambos junto a este HTML.
     Para añadir o cambiar algo, edita esos archivos — aquí no hace
     falta tocar nada.
     ══════════════════════════════════════════════════════════════════ */

  /* Carpeta donde están tus imágenes (relativa al HTML) */
  const CARPETA = "fotos/";

  /* filtros.json usa nombres de campo propios (filename, city,
     capture_type, color_mode…); esto los traduce a lo que espera
     crearFoto */
  function normalizarFoto(p){
    return {
      archivo: p.filename,
      lugar:   p.place || '',
      /* la ciudad viaja tal cual, con sus tildes: el botón del filtro
         lleva ese mismo texto y se comparan sin traducir nada. Antes se
         pasaba a minúsculas y había que acordarse de escribirla sin
         acentos o el filtro no encontraba nada. */
      ciudad:  p.city || '',
      zona:    p.zone || '',
      /* sólo para el visor: ni filtra ni sale en la portada */
      tecnica: {
        objetivo:  p.lens       || '',
        apertura:  p.aperture   || '',
        velocidad: p.shutter    || '',
        iso:       p.iso        || null,
        focal:     p.focal_35   || null,
        pelicula:  p.film       || '',
        revelado:  p.developing || '',
        anio:      p.year       || ''
      },
      formato: p.capture_type,
      color:   p.color_mode,
      camara:  p.camera || '',
      ancho:   p.width,
      alto:    p.height
    };
  }

  /* Proporción alto/ancho de una foto: con ella se estima cuánto ocupará
     en la columna antes de que la imagen llegue a cargarse */
  function proporcion(f){
    return (f.ancho && f.alto) ? f.alto / f.ancho : 0.75;
  }

  /* Reparte las fotos entre las columnas buscando que todas queden de
     alto parecido: coloca primero las más altas y cada una va a la
     columna que de momento va más corta. Un reparto por turnos amontona
     las verticales en la misma columna y deja el mosaico cojo.
     Después cada columna recupera el orden del JSON. */
  function repartirFotos(lista, nCols){
    const cubos = Array.from({ length:nCols }, () => ({ alto:0, indices:[] }));
    lista.map((f, i) => ({ f, i }))
         .sort((a, b) => proporcion(b.f) - proporcion(a.f))
         .forEach(({ f, i }) => {
           const corta = cubos.reduce((min, c) => c.alto < min.alto ? c : min);
           corta.indices.push(i);
           corta.alto += proporcion(f);
         });
    return cubos.map(c => c.indices.sort((a, b) => a - b).map(i => lista[i]));
  }

  /* La ficha técnica de cada fotografía, aparte y a propósito.
     En el dataset de las teselas está lo que filtra y lo que el mosaico
     necesita; esto otro sólo lo consulta el visor al abrir una foto. Al
     no vivir ahí, no puede convertirse en filtro por descuido, que era
     justo lo que se quería evitar. */
  const TECNICA = new Map();

  /* Crea el elemento de una foto */
  function crearFoto(f, prioritaria){
    const fig = document.createElement('figure');
    fig.className = 'tesela tesela--foto al-entrar';
    fig.dataset.formato = f.formato;
    fig.dataset.ciudad  = f.ciudad;
    fig.dataset.trato   = f.color;
    if(f.camara) fig.dataset.camara = f.camara;
    if(f.zona)   fig.dataset.zona   = f.zona;
    TECNICA.set(f.archivo, f.tecnica);

    const img = document.createElement('img');
    img.src = CARPETA + f.archivo;
    img.alt = f.lugar || '';
    img.loading = prioritaria ? 'eager' : 'lazy';
    /* Si defines ancho/alto reales, evitas saltos al cargar (opcional) */
    if(f.ancho && f.alto){ img.width = f.ancho; img.height = f.alto; }

    const cap = document.createElement('figcaption');
    cap.className = 'tesela__rotulo';
    cap.textContent = f.lugar || '';

    fig.append(img, cap);
    return fig;
  }

  /* Crea el elemento de un concepto o haiku */
  function crearTexto(t){
    const div = document.createElement('div');
    if(t.tipo === 'haiku'){
      div.className = 'tesela haiku al-entrar' + (t.der ? ' haiku--der' : '');
      const p = document.createElement('p');
      (t.versos || []).forEach(v => {
        const s = document.createElement('span');
        s.textContent = v;
        p.appendChild(s);
      });
      div.appendChild(p);
    } else {
      div.className = 'tesela concepto concepto--' + (t.fondo || 'pino') +
                      (t.izq ? ' concepto--izq' : '') + ' al-entrar';
      const k = document.createElement('span');
      k.className = 'concepto__kanji'; k.textContent = t.kanji || '';
      const g = document.createElement('span');
      g.className = 'concepto__glosa'; g.textContent = t.nombre || '';
      div.append(k, g);
    }
    return div;
  }

  function esFoto(el){ return el.classList.contains('tesela--foto'); }

  /* Posiciones de una columna donde cabe un separador: solo entre dos
     fotografías. Al exigir foto a ambos lados, dos separadores nunca
     pueden quedar pegados ni asomar al principio o al final. */
  function huecosLibres(col){
    const libres = [];
    for(let i = 1; i < col.length; i++){
      if(esFoto(col[i - 1]) && esFoto(col[i])) libres.push(i);
    }
    return libres;
  }

  /* Baraja una copia del array (Fisher-Yates) */
  function barajar(lista){
    const a = lista.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* Reparte fotos y textos en las tres columnas de forma pareja,
     intercalando los separadores (conceptos y haikus) en una
     posición al azar dentro de cada columna, distinta en cada carga.
     Las fotos vienen de filtros.json y los separadores de
     separadores.json. */
  async function construirMosaico(){
    /* no-cache no es "sin caché": obliga a preguntarle al servidor si el
       archivo cambió. Si no cambió responde 304 y se reutiliza el que ya
       había, así que no cuesta descarga. Sin esto el navegador se queda
       con un filtros.json viejo mientras sirve el index.html nuevo, y la
       galería sale con los botones de hoy y los datos de anteayer. */
    const traer = ruta => fetch(ruta, { cache: 'no-cache' }).then(r => r.json());
    const [datosFotos, datosTextos] = await Promise.all([
      traer('filtros.json'),
      traer('separadores.json')
    ]);
    /* Las fotografías rotan: en cada visita salen en otro orden, igual que
       ya hacían los separadores. El archivo no tiene un principio ni un
       final —no es una serie—, así que fijar el orden sería inventarle una
       jerarquía que no tiene, y quien vuelve se encuentra otra galería.
       Se baraja antes de repartir, no después: el reparto sigue igualando
       el alto de las tres columnas, sólo que ahora resuelve los empates de
       otra manera cada vez. */
    const MIS_FOTOS  = barajar((datosFotos.photos || []).map(normalizarFoto));
    const MIS_TEXTOS = datosTextos.separadores || [];
    const ajustes    = datosTextos.ajustes || {};
    /* Cuántas fotografías por cada separador. Al ser una proporción, el
       número de textos crece solo según vas añadiendo fotos. */
    const fotosPorSeparador = ajustes.fotosPorSeparador > 0 ? ajustes.fotosPorSeparador : 3;

    const colsEl = [
      document.querySelector('.columna--a'),
      document.querySelector('.columna--b'),
      document.querySelector('.columna--c')
    ];
    colsEl.forEach(c => c.innerHTML = '');

    /* fotos repartidas entre las tres columnas, equilibrando el alto */
    const porColumna = repartirFotos(MIS_FOTOS, 3)
      .map(lista => lista.map((f, i) => crearFoto(f, i === 0)));

    /* Los separadores son eso: separan. Van siempre en un hueco entre dos
       fotografías, nunca el primero de la columna, así no caen dos textos
       seguidos —tampoco al apilarse las columnas en móvil, porque toda
       columna arranca con foto.

       Cuántos salen depende del número de fotos, no de una cifra fija: se
       reparten por turnos entre las columnas hasta llegar al objetivo, se
       agota la lista de textos o ninguna columna admite más. Los textos se
       barajan, así que en cada carga sale un subconjunto distinto. */
    const objetivo = Math.min(
      MIS_TEXTOS.length,
      Math.round(MIS_FOTOS.length / fotosPorSeparador)
    );
    const reserva = barajar(MIS_TEXTOS);
    let puestos = 0;
    while(puestos < objetivo && reserva.length){
      let algunoEnEstaVuelta = false;
      for(const col of porColumna){
        if(puestos >= objetivo || !reserva.length) break;
        const huecos = huecosLibres(col);
        if(!huecos.length) continue;
        const pos = huecos[Math.floor(Math.random() * huecos.length)];
        col.splice(pos, 0, crearTexto(reserva.pop()));
        puestos++;
        algunoEnEstaVuelta = true;
      }
      if(!algunoEnEstaVuelta) break;   // ninguna columna tiene ya sitio
    }

    /* Cada columna cierra con un separador. Además de rematarla, es la
       pieza que se estira (ver el CSS) para rellenar el hueco cuando la
       columna acaba antes que las demás. */
    porColumna.forEach(col => {
      if(reserva.length && col.length && esFoto(col[col.length - 1])){
        col.push(crearTexto(reserva.pop()));
      }
    });

    porColumna.forEach((col, i) => col.forEach(el => colsEl[i].appendChild(el)));
  }

  try{
    await construirMosaico();
  }catch(err){
    console.error('No se pudieron cargar filtros.json / separadores.json:', err);
    document.getElementById('mosaico').textContent =
      'No se han podido cargar las fotos. Si estás abriendo el archivo directamente, sírvelo con un servidor local (fetch no funciona con file://).';
    return;
  }

  const elementos = document.querySelectorAll('.al-entrar');
  const sinMovimiento = !window.IntersectionObserver
    || window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(sinMovimiento){
    elementos.forEach(el => el.classList.add('visible'));
  } else {
    const observador = new IntersectionObserver((entradas) => {
      entradas.forEach((entrada, i) => {
        if(entrada.isIntersecting){
          setTimeout(() => entrada.target.classList.add('visible'), i * 85);
          observador.unobserve(entrada.target);
        }
      });
    }, { threshold:0.08, rootMargin:'0px 0px -6% 0px' });

    elementos.forEach(el => observador.observe(el));
  }

  /* ---------- Desplegables ---------- */
  document.querySelectorAll('.grupo__boton').forEach(boton => {
    boton.addEventListener('click', () => {
      const abierto = boton.getAttribute('aria-expanded') === 'true';
      boton.setAttribute('aria-expanded', String(!abierto));
    });
  });

  /* ---------- Filtrado ---------- */
  const EXCLUYENTES = ['formato','trato'];   // una opción a la vez
  /* los ejes que no son excluyentes acumulan varias opciones a la vez */
  const estado = { formato:null, ciudad:new Set(), zona:new Set(),
                   trato:null, camara:new Set() };

  const fotos   = Array.from(document.querySelectorAll('[data-formato]'));
  const opciones = Array.from(document.querySelectorAll('.opcion'));
  const limpiar = document.querySelector('.filtros__limpiar');
  const mosaico = document.getElementById('mosaico');
  const columnas = Array.from(mosaico.querySelectorAll('.columna'));

  /* Anota la posición original de cada tesela para poder restaurarla
     al quitar los filtros */
  columnas.forEach((col, ci) => {
    Array.from(col.children).forEach((hijo, hi) => {
      hijo.dataset.colOrigen = ci;
      hijo.dataset.ordenOrigen = hi;
    });
  });

  /* Pone en cada opción cuántas fotos la cumplen, leyéndolo de las propias
     fotos: así los números salen de filtros.json y no hay que tocarlos
     a mano en el HTML */
  function actualizarCuentas(){
    opciones.forEach(op => {
      const casilla = op.querySelector('.opcion__cuenta');
      if(!casilla) return;
      casilla.textContent = fotos.filter(
        f => f.dataset[op.dataset.eje] === op.dataset.valor
      ).length;
    });
  }

  /* Orden global de una foto (columna, posición) para apilarlas de forma
     coherente en la vista filtrada */
  function ordenGlobal(el){
    return (+el.dataset.colOrigen) * 100 + (+el.dataset.ordenOrigen);
  }

  /* Lista de fotos que el visor puede recorrer, en orden de mosaico.
     En la portada son todas; con filtros, las que encajan. */
  let visibles = [];

  function recalcularVisibles(){
    visibles = fotos
      .filter(f => encaja(f))
      .sort((a, b) => ordenGlobal(a) - ordenGlobal(b));
    visibles.forEach((foto, i) => { foto.dataset.indiceVisor = i; });
  }

  function apilarEnColumna(){
    /* en modo filtrado, además de recorrerlas, se apilan en una columna */
    visibles.forEach(foto => columnas[0].appendChild(foto));
  }

  function restaurarColumnas(){
    /* devuelve cada tesela a su columna y orden originales */
    const todas = Array.from(mosaico.querySelectorAll('[data-col-origen]'));
    todas.sort((a, b) =>
      (a.dataset.colOrigen - b.dataset.colOrigen) ||
      (a.dataset.ordenOrigen - b.dataset.ordenOrigen)
    );
    todas.forEach(el => {
      columnas[+el.dataset.colOrigen].appendChild(el);
    });
  }

  function hayFiltros(){
    return estado.formato !== null || estado.trato !== null
        || estado.ciudad.size > 0  || estado.camara.size > 0
        || estado.zona.size > 0;
  }

  function encaja(foto){
    if(estado.formato && foto.dataset.formato !== estado.formato) return false;
    if(estado.trato   && foto.dataset.trato   !== estado.trato)   return false;
    if(estado.ciudad.size && !estado.ciudad.has(foto.dataset.ciudad)) return false;
    if(estado.camara.size && !estado.camara.has(foto.dataset.camara)) return false;
    if(estado.zona.size   && !estado.zona.has(foto.dataset.zona))     return false;
    return true;
  }

  /* Las zonas viven sangradas bajo su ciudad y sólo asoman cuando esa
     ciudad está marcada: mientras no elijas ciudad, la lista es de
     ciudades a secas. Al desmarcar una hay que soltar también sus zonas,
     o quedaría un filtro puesto que ya no se ve por ninguna parte. */
  const opcionesZona = Array.from(
    document.querySelectorAll('.opcion[data-eje="zona"]'));

  function ajustarZonas(){
    opcionesZona.forEach(op => {
      const cabe = estado.ciudad.has(op.dataset.ciudad);
      op.hidden = !cabe;
      if(!cabe && estado.zona.has(op.dataset.valor)){
        estado.zona.delete(op.dataset.valor);
        op.setAttribute('aria-pressed', 'false');
      }
    });
  }

  function aplicar(){
    ajustarZonas();
    const activos = hayFiltros();

    restaurarColumnas();
    recalcularVisibles();
    if(activos) apilarEnColumna();

    fotos.forEach(foto => { foto.hidden = !encaja(foto); });
    limpiar.classList.toggle('activo', activos);
    mosaico.classList.toggle('filtrando', activos);
    document.querySelector('.cuerpo').classList.toggle('filtrando', activos);
    /* Las teselas de conceptos/haikus/archivo NO aparecen al filtrar:
       son exclusivas de la portada */
    mosaico.querySelectorAll('.concepto, .haiku').forEach(t => {
      t.hidden = activos;
    });
    anunciar();
  }

  const aviso = document.getElementById('aviso-filtros');
  const cuentaVisible = document.querySelector('[data-cuenta]');
  function anunciar(){
    const n = fotos.filter(f => !f.hidden).length;
    const texto = hayFiltros()
      ? `${n} ${n === 1 ? 'fotografía' : 'fotografías'} tras aplicar los filtros`
      : `${fotos.length} fotografías`;
    aviso.textContent = texto;
    if(cuentaVisible) cuentaVisible.textContent = `${fotos.length} fotografías`;
  }

  opciones.forEach(op => {
    op.addEventListener('click', () => {
      const eje = op.dataset.eje, valor = op.dataset.valor;
      const activa = op.getAttribute('aria-pressed') === 'true';

      if(EXCLUYENTES.includes(eje)){
        opciones.filter(o => o.dataset.eje === eje)
                .forEach(o => o.setAttribute('aria-pressed','false'));
        estado[eje] = activa ? null : valor;
        if(!activa) op.setAttribute('aria-pressed','true');
      } else {
        const conjunto = estado[eje];
        if(activa){ conjunto.delete(valor); op.setAttribute('aria-pressed','false'); }
        else      { conjunto.add(valor);    op.setAttribute('aria-pressed','true');  }
      }
      aplicar();
    });
  });

  function quitarFiltros(){
    estado.formato = null; estado.trato = null;
    estado.ciudad.clear(); estado.camara.clear(); estado.zona.clear();
    opciones.forEach(o => o.setAttribute('aria-pressed','false'));
    aplicar();
  }

  limpiar.addEventListener('click', quitarFiltros);

  /* El nombre SANLO devuelve a la portada: quita los filtros y sube arriba */
  const volverInicio = document.getElementById('volver-inicio');
  volverInicio.addEventListener('click', () => {
    const habiaFiltros = hayFiltros();
    if(habiaFiltros) quitarFiltros();
    const suave = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top:0, behavior: suave ? 'smooth' : 'auto' });
  });

  /* ---------- Visor a pantalla completa ---------- */
  const visor      = document.getElementById('visor');
  const visorImg   = document.getElementById('visor-img');
  const visorLugar = document.getElementById('visor-lugar');
  const visorExpo  = document.getElementById('visor-exposicion');
  const visorFocal = document.getElementById('visor-focal');
  const visorLista = document.getElementById('visor-lista');
  const visorCuenta= document.getElementById('visor-cuenta');
  const btnPrev    = visor.querySelector('.visor__flecha--prev');
  const btnNext    = visor.querySelector('.visor__flecha--next');
  const btnCerrar  = visor.querySelector('.visor__cerrar');

  let indiceActual = 0;
  let ultimoFoco   = null;

  /* Sólo traduce los valores en clave; ciudades y cámaras se escriben
     ya legibles en filtros.json y se muestran tal cual. */
  const ETIQUETAS = {
    digital:'Digital', analogico:'Analógico',
    bn:'Blanco y negro', color:'Color'
  };

  /* Datos de la ficha: un título y una lista de pares rótulo/valor.
     Encabeza el lugar y, mientras no lo hayas escrito, sube la ciudad a
     ese puesto para que la ficha no quede huérfana de título. */
  function fichaDeFoto(foto){
    const d = foto.dataset;
    const rotulo = foto.querySelector('.tesela__rotulo');
    const lugar  = rotulo ? rotulo.textContent.trim() : '';
    const ciudad = d.ciudad || '';
    const img    = foto.querySelector('img');
    const t = TECNICA.get(img ? img.getAttribute('src').split('/').pop() : '') || {};

    /* Los ajustes del disparo, cantados de un tirón como se dicen de viva
       voz, y la focal debajo. Lo que falte no deja hueco. */
    const exposicion = [
      t.apertura,
      t.velocidad,
      t.iso ? 'ISO ' + t.iso : null
    ].filter(Boolean).join(' · ');
    /* "equiv." no sobra: el objetivo se nombra con su focal real —4,5-36
       en la compacta, 18-135 en la réflex— y sin la coletilla parecería
       que 61 mm no cabe en ese objetivo. */
    const focal = t.focal ? t.focal + ' mm equiv.' : '';

    const filas  = [
      /* si el lugar ya encabeza, la ciudad baja a la lista */
      lugar ? ['Ciudad', ciudad] : null,
      /* la zona va pegada a la ciudad, que es de donde cuelga */
      d.zona              ? ['Zona', d.zona]                     : null,
      d.camara            ? ['Cámara', d.camara]                 : null,
      t.objetivo          ? ['Objetivo', t.objetivo]             : null,
      t.pelicula          ? ['Película', t.pelicula]             : null,
      t.revelado          ? ['Revelado', t.revelado]             : null,
      ETIQUETAS[d.formato]? ['Formato', ETIQUETAS[d.formato]]    : null,
      ETIQUETAS[d.trato]  ? ['Tratamiento', ETIQUETAS[d.trato]]  : null,
      t.anio              ? ['Año', t.anio]                      : null
    ].filter(Boolean);
    return { titulo: lugar || ciudad, exposicion, focal, filas };
  }

  /* Vuelca la ficha en el panel */
  function pintarFicha(foto){
    const { titulo, exposicion, focal, filas } = fichaDeFoto(foto);
    visorLugar.textContent = titulo;
    visorExpo.textContent  = exposicion;
    visorFocal.textContent = focal;
    visorLista.textContent = '';
    filas.forEach(([rotulo, valor]) => {
      const fila = document.createElement('div');
      fila.className = 'ficha__fila';
      const dt = document.createElement('dt');
      dt.textContent = rotulo;
      const dd = document.createElement('dd');
      dd.textContent = valor;
      fila.append(dt, dd);
      visorLista.appendChild(fila);
    });
  }

  function mostrar(i){
    if(i < 0 || i >= visibles.length) return;
    indiceActual = i;
    const foto = visibles[i];
    const img  = foto.querySelector('img');

    visorImg.classList.remove('cargada');
    visorImg.onload = () => visorImg.classList.add('cargada');
    visorImg.src = img.currentSrc || img.src;
    visorImg.alt = img.alt || '';
    if(visorImg.complete) visorImg.classList.add('cargada');

    pintarFicha(foto);
    visorCuenta.textContent = `${i + 1} / ${visibles.length}`;

    btnPrev.disabled = i === 0;
    btnNext.disabled = i === visibles.length - 1;
  }

  function abrirVisor(i){
    if(!visibles.length) return;
    ultimoFoco = document.activeElement;
    visor.hidden = false;
    requestAnimationFrame(() => visor.classList.add('abierto'));
    document.body.style.overflow = 'hidden';
    mostrar(i);
    btnNext.focus();
  }

  function cerrarVisor(){
    visor.classList.remove('abierto');
    document.body.style.overflow = '';
    const fin = () => {
      visor.hidden = true;
      visor.removeEventListener('transitionend', fin);
      if(ultimoFoco) ultimoFoco.focus();
    };
    visor.addEventListener('transitionend', fin);
  }

  /* Abrir al pulsar cualquier foto, tanto en portada como filtrando */
  mosaico.addEventListener('click', (e) => {
    const foto = e.target.closest('.tesela--foto');
    if(!foto || foto.hidden) return;
    const i = visibles.indexOf(foto);
    if(i !== -1) abrirVisor(i);
  });

  btnPrev.addEventListener('click', () => mostrar(indiceActual - 1));
  btnNext.addEventListener('click', () => mostrar(indiceActual + 1));
  btnCerrar.addEventListener('click', cerrarVisor);

  /* Clic en el fondo del escenario cierra */
  visor.querySelector('.visor__escena').addEventListener('click', (e) => {
    if(e.target.classList.contains('visor__escena')) cerrarVisor();
  });

  document.addEventListener('keydown', (e) => {
    if(visor.hidden) return;
    if(e.key === 'Escape')      cerrarVisor();
    if(e.key === 'ArrowLeft')   mostrar(indiceActual - 1);
    if(e.key === 'ArrowRight')  mostrar(indiceActual + 1);
  });

  /* Deslizar para navegar en táctil */
  let xInicio = null, yInicio = null;
  const escena = visor.querySelector('.visor__escena');
  escena.addEventListener('touchstart', (e) => {
    xInicio = e.changedTouches[0].clientX;
    yInicio = e.changedTouches[0].clientY;
  }, { passive:true });
  escena.addEventListener('touchend', (e) => {
    if(xInicio === null) return;
    const dx = e.changedTouches[0].clientX - xInicio;
    const dy = e.changedTouches[0].clientY - yInicio;
    /* solo cuenta como swipe horizontal si domina sobre el vertical */
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){
      mostrar(indiceActual + (dx < 0 ? 1 : -1));
    }
    xInicio = yInicio = null;
  }, { passive:true });

  actualizarCuentas();
  ajustarZonas();      // al arrancar no hay ciudad: la zona nace apagada
  recalcularVisibles();
  anunciar();
})();
</script>

</body>
</html>
